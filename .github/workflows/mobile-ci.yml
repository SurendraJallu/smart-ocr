name: Mobile CI

on:
  push:
    branches:
      - main
      - develop
      - "features/**"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform project files
        working-directory: mobile
        run: flutter create --platforms=android,ios --org com.smartocr .
      - name: Install packages
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Dart source
        working-directory: mobile
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test
