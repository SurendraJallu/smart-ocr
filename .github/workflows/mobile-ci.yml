name: Mobile CI

on:
  push:
    branches:
      - main
      - develop
      - "features/**"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    name: Flutter analyze, test and Android demo APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS platform project files
        working-directory: mobile
        run: flutter create --platforms=android,ios --org com.smartocr .

      - name: Install Flutter packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Build Android debug demo APK
        working-directory: mobile
        run: flutter build apk --debug --dart-define=SMART_OCR_API_URL=http://10.0.2.2:8081/api/v1

      - name: Upload Android demo APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-ocr-android-demo
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
